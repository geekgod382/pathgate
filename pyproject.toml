[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathgate"
version = "0.2.5"
description = "Filesystem MCP server with allow-listed directories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2,<3"]

[project.scripts]
pathgate = "pathgate.server:main"